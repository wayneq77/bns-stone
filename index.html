<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劍靈：革命 靈石追蹤器</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="bg-glow"></div>

    <header class="site-header">
        <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h1 class="logo">
                    <span class="logo-icon">💎</span>
                    <span class="logo-text" data-i18n="title">靈石追蹤器</span>
                </h1>
                <p class="subtitle" data-i18n="subtitle">劍靈：革命 · 及時掌握靈石動向</p>
            </div>
            <div style="display:flex; gap: 8px;">
                <button id="alarm-toggle" class="btn btn-sm" style="background:#374151; color:white; font-size:1.1rem; padding: 4px 8px; line-height: 1;">🔕</button>
                <button id="lang-toggle" class="btn btn-sm" style="background:#4b5563; color:white;">English</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- 確認對話框 -->
        <div id="confirm-modal" class="modal">
            <div class="modal-content">
                <p id="modal-message" class="modal-message"></p>
                <p id="modal-submsg" class="modal-submsg"></p>
                <div class="modal-actions">
                    <button id="modal-confirm" class="btn btn-primary btn-sm">確定</button>
                    <button id="modal-cancel" class="btn btn-ghost btn-sm">取消</button>
                </div>
            </div>
        </div>

        <!-- Toast 通知 -->
        <div id="toast-container"></div>

        <!-- 地圖卡片網格 -->
        <div class="maps-grid">
            <!-- 靈石谷 -->
            <div class="map-card" id="card-spirit-stone-valley" data-map="spirit-stone-valley">
                <div class="card-header">
                    <div class="map-icon">🏔️</div>
                    <div class="map-info">
                        <h2 class="map-name" data-i18n="spirit-stone-valley">靈石谷</h2>
                        <span class="map-status" id="status-spirit-stone-valley" data-i18n="pending">等待設定</span>
                    </div>
                </div>
                <div class="timer-display" id="timer-spirit-stone-valley">
                    <div class="timer-row">
                        <span class="timer-label" data-i18n="nextSpawn">下次出現</span>
                        <div class="timer-value-container">
                            <span class="timer-value" id="next-spirit-stone-valley">--:--:--</span>
                            <div class="adjust-btns">
                                <button class="btn-adjust" data-action="adjust" data-amount="-10" data-map="spirit-stone-valley">-10</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="-1" data-map="spirit-stone-valley">-1</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="1" data-map="spirit-stone-valley">+1</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="10" data-map="spirit-stone-valley">+10</button>
                            </div>
                        </div>
                    </div>
                    <div class="timer-row">
                        <span class="timer-label" data-i18n="remaining">剩餘</span>
                        <span class="timer-countdown" id="countdown-spirit-stone-valley">--:--:--</span>
                    </div>
                </div>
                <div class="card-actions">
                    <div class="actions-top">
                        <button class="btn btn-primary set-btn" data-action="set" data-map="spirit-stone-valley" data-i18n="btnSpawned">已出現靈石</button>
                        <button class="btn btn-info interval-btn" data-action="interval" data-map="spirit-stone-valley" data-i18n="btnUpcoming">即將出現靈石</button>
                    </div>
                    <div class="actions-bottom">
                        <button class="btn btn-success collected-btn" data-action="collected" data-map="spirit-stone-valley" data-i18n="btnCollected">已撿完</button>
                    </div>
                </div>
            </div>

            <!-- 玉皇要塞 -->
            <div class="map-card" id="card-yu-hwang-fortress" data-map="yu-hwang-fortress">
                <div class="card-header">
                    <div class="map-icon">🏯</div>
                    <div class="map-info">
                        <h2 class="map-name" data-i18n="yu-hwang-fortress">玉皇要塞</h2>
                        <span class="map-status" id="status-yu-hwang-fortress" data-i18n="pending">等待設定</span>
                    </div>
                </div>
                <div class="timer-display" id="timer-yu-hwang-fortress">
                    <div class="timer-row">
                        <span class="timer-label" data-i18n="nextSpawn">下次出現</span>
                        <div class="timer-value-container">
                            <span class="timer-value" id="next-yu-hwang-fortress">--:--:--</span>
                            <div class="adjust-btns">
                                <button class="btn-adjust" data-action="adjust" data-amount="-10" data-map="yu-hwang-fortress">-10</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="-1" data-map="yu-hwang-fortress">-1</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="1" data-map="yu-hwang-fortress">+1</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="10" data-map="yu-hwang-fortress">+10</button>
                            </div>
                        </div>
                    </div>
                    <div class="timer-row">
                        <span class="timer-label" data-i18n="remaining">剩餘</span>
                        <span class="timer-countdown" id="countdown-yu-hwang-fortress">--:--:--</span>
                    </div>
                </div>
                <div class="card-actions">
                    <div class="actions-top">
                        <button class="btn btn-primary set-btn" data-action="set" data-map="yu-hwang-fortress" data-i18n="btnSpawned">已出現靈石</button>
                        <button class="btn btn-info interval-btn" data-action="interval" data-map="yu-hwang-fortress" data-i18n="btnUpcoming">即將出現靈石</button>
                    </div>
                    <div class="actions-bottom">
                        <button class="btn btn-success collected-btn" data-action="collected" data-map="yu-hwang-fortress" data-i18n="btnCollected">已撿完</button>
                    </div>
                </div>
            </div>

            <!-- 糾土地帶 -->
            <div class="map-card" id="card-blood-ruffian-base" data-map="blood-ruffian-base">
                <div class="card-header">
                    <div class="map-icon">🩸</div>
                    <div class="map-info">
                        <h2 class="map-name" data-i18n="blood-ruffian-base">糾土地帶</h2>
                        <span class="map-status" id="status-blood-ruffian-base" data-i18n="pending">等待設定</span>
                    </div>
                </div>
                <div class="timer-display" id="timer-blood-ruffian-base">
                    <div class="timer-row">
                        <span class="timer-label" data-i18n="nextSpawn">下次出現</span>
                        <div class="timer-value-container">
                            <span class="timer-value" id="next-blood-ruffian-base">--:--:--</span>
                            <div class="adjust-btns">
                                <button class="btn-adjust" data-action="adjust" data-amount="-10" data-map="blood-ruffian-base">-10</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="-1" data-map="blood-ruffian-base">-1</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="1" data-map="blood-ruffian-base">+1</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="10" data-map="blood-ruffian-base">+10</button>
                            </div>
                        </div>
                    </div>
                    <div class="timer-row">
                        <span class="timer-label" data-i18n="remaining">剩餘</span>
                        <span class="timer-countdown" id="countdown-blood-ruffian-base">--:--:--</span>
                    </div>
                </div>
                <div class="card-actions">
                    <div class="actions-top">
                        <button class="btn btn-primary set-btn" data-action="set" data-map="blood-ruffian-base" data-i18n="btnSpawned">已出現靈石</button>
                        <button class="btn btn-info interval-btn" data-action="interval" data-map="blood-ruffian-base" data-i18n="btnUpcoming">即將出現靈石</button>
                    </div>
                    <div class="actions-bottom">
                        <button class="btn btn-success collected-btn" data-action="collected" data-map="blood-ruffian-base" data-i18n="btnCollected">已撿完</button>
                    </div>
                </div>
            </div>

            <!-- 赤龍火山 -->
            <div class="map-card" id="card-red-dragon-forge" data-map="red-dragon-forge">
                <div class="card-header">
                    <div class="map-icon">🌋</div>
                    <div class="map-info">
                        <h2 class="map-name" data-i18n="red-dragon-forge">赤龍火山</h2>
                        <span class="map-status" id="status-red-dragon-forge" data-i18n="pending">等待設定</span>
                    </div>
                </div>
                <div class="timer-display" id="timer-red-dragon-forge">
                    <div class="timer-row">
                        <span class="timer-label" data-i18n="nextSpawn">下次出現</span>
                        <div class="timer-value-container">
                            <span class="timer-value" id="next-red-dragon-forge">--:--:--</span>
                            <div class="adjust-btns">
                                <button class="btn-adjust" data-action="adjust" data-amount="-10" data-map="red-dragon-forge">-10</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="-1" data-map="red-dragon-forge">-1</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="1" data-map="red-dragon-forge">+1</button>
                                <button class="btn-adjust" data-action="adjust" data-amount="10" data-map="red-dragon-forge">+10</button>
                            </div>
                        </div>
                    </div>
                    <div class="timer-row">
                        <span class="timer-label" data-i18n="remaining">剩餘</span>
                        <span class="timer-countdown" id="countdown-red-dragon-forge">--:--:--</span>
                    </div>
                </div>
                <div class="card-actions">
                    <div class="actions-top">
                        <button class="btn btn-primary set-btn" data-action="set" data-map="red-dragon-forge" data-i18n="btnSpawned">已出現靈石</button>
                        <button class="btn btn-info interval-btn" data-action="interval" data-map="red-dragon-forge" data-i18n="btnUpcoming">即將出現靈石</button>
                    </div>
                    <div class="actions-bottom">
                        <button class="btn btn-success collected-btn" data-action="collected" data-map="red-dragon-forge" data-i18n="btnCollected">已撿完</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 連線狀態 -->
        <div class="connection-status-container">
            <div class="connection-status" id="connection-status">
                <span class="connection-dot offline"></span>
                <span class="connection-text">離線 (本地模式)</span>
            </div>
            <div id="last-updated" class="last-updated"></div>
        </div>
    </main>

    <script src="/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" id="supabase-cdn"></script>
    <script src="/app.js?v=20260413_fix1"></script>
</body>
</html>
